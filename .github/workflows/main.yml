name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: yarn
    - name: Download dependencies
      run: yarn install --frozen-lockfile
    - name: Lint
      run: yarn lint

  test:
    name: node ${{ matrix.node }} / eslint ${{ matrix.eslint }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor of the `engines` field, plus every current LTS line.
        node: ['20', '22', '24']
        # Every major allowed by the `eslint` peerDependency range.
        eslint: ['8', '9', '10']
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node }}
        cache: yarn
    - name: Download dependencies
      run: yarn install --frozen-lockfile
    - name: Install ESLint ${{ matrix.eslint }}
      run: yarn add --dev eslint@${{ matrix.eslint }}
    - name: Report resolved versions
      run: node -p "'node ' + process.version + ' / eslint ' + require('eslint/package.json').version"
    - name: Unit Test
      run: yarn test
